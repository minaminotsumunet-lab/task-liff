<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>タスク登録フォームへ遷移中</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"メイリオ",sans-serif;
      padding:40px 16px;
      text-align:center;
      line-height:1.7;
    }
    h1{font-size:22px;margin-bottom:16px;}
    #status{margin-top:16px;font-size:14px;color:#555;white-space:pre-line;}
    button{
      margin-top:24px;
      padding:10px 24px;
      border:none;
      border-radius:6px;
      background:#06C755;
      color:#fff;
      font-size:16px;
    }
  </style>
</head>
<body>
  <h1>タスク登録フォームを開いています…</h1>
  <p>自動で遷移しない場合は下のボタンを押してください。</p>
  <button id="openBtn">フォームを開く</button>
  <div id="status"></div>

  <script>
    // ★ここをあなたの情報に書き換え
    const LIFF_ID  = '2008630984-XngdzBvN'; // あなたの LIFF ID
    const FORM_URL = 'https://script.google.com/macros/s/AKfycbyCp4GAzeOuAOWNs2n5ksCySKUvlQV9flMlOhkt8DY-6crbj3dBlcVxjgj8fq6jbkk/exec'; // さっきのGAS WebアプリURL

    const statusEl = document.getElementById('status');
    const openBtn  = document.getElementById('openBtn');
    const log = msg => statusEl.textContent = msg;

    openBtn.onclick = () => {
      // フォールバック（IDなしでフォームだけ開く）
      location.href = FORM_URL;
    };

    async function main(){
      try{
        log('LIFF 初期化中…');
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          log('ログインします…');
          liff.login({ redirectUri: location.href });
          return;
        }

        log('プロフィール取得中…');
        const profile = await liff.getProfile();
        const userId  = profile.userId;

        log('依頼者IDを取得しました。フォームへ遷移します…');

        const target = FORM_URL + '?lineUserId=' + encodeURIComponent(userId);
        location.replace(target);

      } catch (e) {
        console.error(e);
        log('LIFF エラー: ' + (e && e.message ? e.message : e) +
            '\nこのままフォームのみ開きます。');
        location.href = FORM_URL;
      }
    }

    window.addEventListener('load', main);
  </script>
</body>
</html>
